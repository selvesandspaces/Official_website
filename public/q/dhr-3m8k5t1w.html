<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>DHR — A Mental Wellbeing Quiz for Men — Selves & Spaces</title>
<script src="config.js"></script>
</head>
<body>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap');

  .dhr-root {
    --ink: #3B2A50;
    --paper: #F6F2F9;
    --lav: #A78BC4;
    --lav-deep: #8A68AC;
    --sage: #8FA6C9;
    --dusty: #C97064;
    --gold: #D9A441;
    --line: rgba(59,42,80,0.14);
    font-family: 'Work Sans', sans-serif;
    color: var(--ink);
    background: var(--ink);
    min-height: 100vh;
    padding: 40px 20px 64px;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
  }
  .dhr-root * { box-sizing: border-box; }

  .dhr-glow {
    position: absolute; top: -180px; left: 50%;
    transform: translateX(-50%);
    width: 640px; height: 640px; border-radius: 50%;
    background: radial-gradient(circle, rgba(167,139,196,0.28), transparent 70%);
    filter: blur(10px);
    transition: background 0.8s ease;
    pointer-events: none;
  }

  .dhr-wrap { max-width: 640px; margin: 0 auto; position: relative; z-index: 1; }

  .dhr-logo-row { display: flex; justify-content: center; margin-bottom: 14px; }
  .dhr-logo { height: 64px; width: auto; object-fit: contain; }

  .dhr-eyebrow {
    font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--lav); text-align: center; margin-bottom: 10px; font-weight: 600;
  }

  .dhr-title {
    font-family: 'Fraunces', serif;
    font-size: clamp(30px, 5.6vw, 44px);
    font-weight: 600; color: var(--paper); text-align: center;
    margin: 0 0 6px; letter-spacing: -0.01em;
  }
  .dhr-title-sub {
    text-align: center; font-family: 'Fraunces', serif; font-style: italic;
    font-size: 16px; color: var(--lav); margin: 0 0 8px;
  }

  .dhr-sub {
    text-align: center; color: rgba(246,242,249,0.68); font-size: 15px;
    max-width: 440px; margin: 0 auto 32px; line-height: 1.5;
  }

  .dhr-progress-wrap { margin-bottom: 26px; }
  .dhr-progress-label {
    display: flex; justify-content: space-between;
    font-size: 12px; color: rgba(246,242,249,0.55);
    margin-bottom: 8px; letter-spacing: 0.02em;
  }
  .dhr-progress-bar {
    height: 5px; border-radius: 999px; background: rgba(246,242,249,0.18);
    overflow: hidden;
  }
  .dhr-progress-fill {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--lav), var(--gold));
    transition: width 0.4s ease;
  }

  .dhr-card {
    background: var(--paper); border-radius: 20px;
    padding: 40px 36px 32px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.5);
    min-height: 380px; display: flex; flex-direction: column;
  }

  .dhr-qnum {
    font-family: 'Fraunces', serif; font-style: italic; font-size: 14px;
    color: var(--lav-deep); margin-bottom: 12px;
  }

  .dhr-question {
    font-family: 'Fraunces', serif;
    font-size: clamp(20px, 3vw, 25px);
    font-weight: 500; line-height: 1.35;
    margin: 0 0 24px; color: var(--ink);
  }

  .dhr-hint {
    font-size: 13px; color: rgba(59,42,80,0.5); font-style: italic;
    margin: -14px 0 22px;
  }

  .dhr-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }

  .dhr-opt {
    text-align: left; background: transparent; border: 1.5px solid var(--line);
    border-radius: 12px; padding: 14px 18px; font-family: 'Work Sans', sans-serif;
    font-size: 15px; color: var(--ink); cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
    display: flex; align-items: center; gap: 12px; line-height: 1.4;
  }
  .dhr-opt:hover:not(.selected) { border-color: var(--lav); background: rgba(167,139,196,0.08); }
  .dhr-opt:active { transform: scale(0.99); }
  .dhr-opt.selected { border-color: var(--lav-deep); background: rgba(167,139,196,0.18); }
  .dhr-opt-emoji { font-size: 20px; flex-shrink: 0; }

  /* Image grid section 1 */
  .dhr-image-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  }
  .dhr-image-tile {
    background: #fff; border: 1.5px solid var(--line); border-radius: 14px;
    padding: 22px 10px; text-align: center; cursor: pointer;
    transition: all 0.2s ease;
  }
  .dhr-image-tile:hover { border-color: var(--lav); transform: translateY(-2px); background: rgba(167,139,196,0.06); }
  .dhr-image-tile .em { font-size: 30px; display: block; margin-bottom: 8px; }
  .dhr-image-tile .lb { font-size: 13.5px; color: var(--ink); line-height: 1.3; }

  /* Likert */
  .dhr-likert { display: flex; flex-direction: column; gap: 8px; }
  .dhr-likert-btn {
    text-align: left; background: transparent; border: 1.5px solid var(--line);
    border-radius: 10px; padding: 12px 16px; font-family: 'Work Sans', sans-serif;
    font-size: 14.5px; color: var(--ink); cursor: pointer;
    display: flex; align-items: center; gap: 12px;
    transition: all 0.2s ease;
  }
  .dhr-likert-btn:hover:not(.selected) { border-color: var(--lav); background: rgba(167,139,196,0.08); }
  .dhr-likert-btn.selected { border-color: var(--lav-deep); background: rgba(167,139,196,0.18); }
  .dhr-likert-dot {
    width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line);
    flex-shrink: 0;
  }
  .dhr-likert-btn.selected .dhr-likert-dot { background: var(--lav-deep); border-color: var(--lav-deep); }

  .dhr-footer-row { margin-top: auto; padding-top: 22px; display: flex; justify-content: flex-end; }
  .dhr-next {
    font-family: 'Work Sans', sans-serif; font-weight: 600; font-size: 14.5px;
    color: var(--paper); background: var(--ink); border: none; border-radius: 999px;
    padding: 12px 24px; cursor: pointer;
    opacity: 0; transform: translateY(4px); pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease, background 0.2s ease;
  }
  .dhr-next.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .dhr-next:hover { background: var(--lav-deep); }

  /* Intake */
  .dhr-field { margin-bottom: 16px; }
  .dhr-field label {
    display: block; font-size: 12.5px; font-weight: 600; letter-spacing: 0.04em;
    text-transform: uppercase; color: rgba(59,42,80,0.55); margin-bottom: 6px;
  }
  .dhr-field input {
    width: 100%; border: 1.5px solid var(--line); border-radius: 10px;
    padding: 12px 14px; font-family: 'Work Sans', sans-serif; font-size: 15px;
    color: var(--ink); background: #fff; outline: none; transition: border-color 0.2s ease;
  }
  .dhr-field input:focus { border-color: var(--lav); }
  .dhr-field-error { font-size: 12.5px; color: var(--dusty); margin-top: 5px; display: none; }
  .dhr-field.err input { border-color: var(--dusty); }
  .dhr-field.err .dhr-field-error { display: block; }

  .dhr-honest-note {
    background: rgba(167,139,196,0.1); border: 1px dashed rgba(167,139,196,0.5);
    border-radius: 12px; padding: 14px 16px; font-size: 13.5px; line-height: 1.55;
    color: var(--ink); margin-bottom: 22px;
  }

  .dhr-start-btn {
    width: 100%; margin-top: 6px; font-family: 'Work Sans', sans-serif; font-weight: 600;
    font-size: 15px; color: var(--paper); background: var(--ink); border: none;
    border-radius: 999px; padding: 15px 24px; cursor: pointer; transition: background 0.2s ease;
  }
  .dhr-start-btn:hover { background: var(--lav-deep); }
  .dhr-privacy-note { text-align: center; font-size: 12px; color: rgba(59,42,80,0.45); margin-top: 14px; line-height: 1.5; }

  /* Gate */
  .dhr-gate { text-align: center; padding: 20px 4px 4px; }
  .dhr-gate-icon {
    width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 20px;
    background: linear-gradient(135deg, #A78BC4, #C97064 60%, #833AB4);
    display: flex; align-items: center; justify-content: center;
  }
  .dhr-gate-icon svg { width: 28px; height: 28px; }
  .dhr-gate-title { font-family: 'Fraunces', serif; font-size: 23px; font-weight: 500; margin-bottom: 10px; color: var(--ink); }
  .dhr-gate-sub { font-size: 14.5px; color: rgba(59,42,80,0.68); max-width: 400px; margin: 0 auto 26px; line-height: 1.6; }
  .dhr-gate-follow {
    display: inline-flex; align-items: center; gap: 8px; font-family: 'Work Sans', sans-serif;
    font-weight: 600; font-size: 14.5px; color: #fff;
    background: linear-gradient(135deg, #F58529, #DD2A7B 45%, #8134AF 85%);
    border: none; border-radius: 999px; padding: 13px 26px; cursor: pointer;
    text-decoration: none; margin-bottom: 16px; transition: transform 0.15s ease;
  }
  .dhr-gate-follow:hover { transform: translateY(-1px); }
  .dhr-gate-unlock {
    display: block; margin: 0 auto; font-family: 'Work Sans', sans-serif; font-weight: 600;
    font-size: 14px; color: var(--ink); background: transparent; border: 1.5px solid var(--ink);
    border-radius: 999px; padding: 12px 24px; cursor: pointer; transition: all 0.2s ease;
  }
  .dhr-gate-unlock:hover { background: var(--ink); color: var(--paper); }
  .dhr-gate-hint { font-size: 12px; color: rgba(59,42,80,0.45); margin-top: 12px; }

  /* Results */
  .dhr-result-score-row { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; }
  .dhr-result-score { font-family: 'Fraunces', serif; font-size: 46px; font-weight: 600; color: var(--ink); line-height: 1; }
  .dhr-result-score span { font-size: 20px; color: rgba(59,42,80,0.4); }
  .dhr-result-bar-wrap { flex: 1; }
  .dhr-result-bar-track { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; margin-bottom: 4px; }
  .dhr-result-bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--lav), var(--gold)); }
  .dhr-result-bar-pct { font-size: 12px; color: rgba(59,42,80,0.5); }

  .dhr-category { text-align: center; margin-bottom: 24px; }
  .dhr-category-name {
    font-family: 'Fraunces', serif; font-size: 26px; font-weight: 600; color: var(--ink); margin-bottom: 14px;
  }
  .dhr-category-desc { font-size: 14.5px; line-height: 1.65; color: rgba(59,42,80,0.85); text-align: left; }
  .dhr-category-desc p { margin: 0 0 12px; }

  .dhr-archetype {
    background: linear-gradient(135deg, rgba(217,164,65,0.12), rgba(167,139,196,0.12));
    border: 1px solid rgba(217,164,65,0.35);
    border-radius: 14px; padding: 20px 22px; margin-bottom: 22px;
  }
  .dhr-archetype-label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); font-weight: 700; margin-bottom: 6px; }
  .dhr-archetype-name { font-family: 'Fraunces', serif; font-size: 19px; color: var(--ink); margin-bottom: 8px; }
  .dhr-archetype-desc { font-size: 13.5px; line-height: 1.6; color: rgba(59,42,80,0.85); }

  .dhr-challenge {
    background: var(--ink); border-radius: 14px; padding: 20px 22px; margin-bottom: 22px;
  }
  .dhr-challenge-label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--lav); font-weight: 700; margin-bottom: 8px; }
  .dhr-challenge-text { font-size: 14px; line-height: 1.6; color: rgba(246,242,249,0.88); }

  .dhr-longing {
    border-top: 1px dashed var(--line); padding-top: 20px; margin-bottom: 22px;
  }
  .dhr-longing-label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--lav-deep); font-weight: 700; margin-bottom: 6px; }
  .dhr-longing-choice { font-family: 'Fraunces', serif; font-style: italic; font-size: 18px; color: var(--ink); margin-bottom: 10px; }
  .dhr-longing-text { font-size: 13.5px; line-height: 1.6; color: rgba(59,42,80,0.85); }

  .dhr-gift {
    background: linear-gradient(135deg, var(--ink), #4E3866);
    border-radius: 14px; padding: 22px 22px 24px; margin-bottom: 22px; text-align: center;
  }
  .dhr-gift-label { font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); font-weight: 700; margin-bottom: 8px; }
  .dhr-gift-title { font-family: 'Fraunces', serif; font-size: 20px; color: var(--paper); margin-bottom: 8px; }
  .dhr-gift-msg { font-size: 14px; color: rgba(246,242,249,0.8); line-height: 1.6; max-width: 380px; margin: 0 auto; }

  .dhr-closing {
    font-size: 12px; line-height: 1.6; color: rgba(59,42,80,0.5); font-style: italic;
    border-top: 1px solid var(--line); padding-top: 16px; margin-bottom: 20px;
  }

  .dhr-restart {
    font-family: 'Work Sans', sans-serif; font-weight: 600; font-size: 14.5px; color: var(--ink);
    background: transparent; border: 1.5px solid var(--ink); border-radius: 999px;
    padding: 12px 26px; cursor: pointer; transition: all 0.2s ease; display: block; margin: 0 auto;
  }
  .dhr-restart:hover { background: var(--ink); color: var(--paper); }

  @media (prefers-reduced-motion: reduce) {
    .dhr-opt, .dhr-next, .dhr-progress-fill, .dhr-likert-btn { transition: none; }
  }
  @media (max-width: 480px) {
    .dhr-card { padding: 30px 22px 24px; border-radius: 16px; }
    .dhr-image-grid { grid-template-columns: 1fr; }
  }
</style>

    { text: "I try to understand why I'm feeling angry or stressed before I react to the people around me.", key: "A" },
    { text: "When I'm going through a hard time, I tell the raw, unedited truth about how I'm doing to the people I trust.", key: "A" },

  likertStatements.forEach(s => {

  // SECTION 5: The Honest Need (no scoring, saved as choice)
  const finalOptions = [
    "More peace", "Better sleep", "More time", "Less pressure", "Someone to talk to",
    "More confidence", "Better health", "More meaningful friendships", "More motivation",
    "Better work-life balance", "More purpose", "Financial security"
  ];
  questions.push({
    section: "The Honest Need", type: "final",
    q: "If you could honestly introduce just one of these things into your life right now, what would it be?",
    options: finalOptions.map(o => ({ label: o }))
  });

  const LIKERT_LABELS = ["Strongly Disagree", "Disagree", "Neutral", "Agree", "Strongly Agree"];
  const LIKERT_A = [1, 2, 3, 4, 5];
  const LIKERT_B = [5, 4, 3, 2, 1];

  // ---------- STATE ----------
  let stage = 'intake'; // intake -> quiz -> gate -> result
  let current = 0;
  let totalScore = 0;
  let q21Choice = "";
  let userInfo = { name: "", dob: "", email: "" };
  let dhrAnswers = [];

  const card = document.getElementById('dhrCard');
  const glow = document.getElementById('dhrGlow');
  const titleEl = document.getElementById('dhrTitle');
  const titleSubEl = document.getElementById('dhrTitleSub');
  const subEl = document.getElementById('dhrSub');
  const progressWrap = document.getElementById('dhrProgressWrap');
  const progressLabel = document.getElementById('dhrProgressLabel');
  const progressPct = document.getElementById('dhrProgressPct');
  const progressFill = document.getElementById('dhrProgressFill');

  function isValidEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
  function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

  function updateProgress() {
    const pct = Math.round((current / questions.length) * 100);
    progressLabel.textContent = `Question ${current + 1} of ${questions.length}`;
    progressPct.textContent = pct + '%';
    progressFill.style.width = pct + '%';
  }

  // ---------- INTAKE ----------
  function renderIntake() {
    progressWrap.style.display = 'none';
    titleEl.textContent = "DHR";
    titleSubEl.textContent = "A Mental Wellbeing Quiz for Men";
    subEl.textContent = "A few honest minutes with yourself. No marks, no right or wrong answers, just a mirror.";
    glow.style.background = 'radial-gradient(circle, rgba(167,139,196,0.28), transparent 70%)';

    card.innerHTML = `
      <div class="dhr-qnum">Before you begin</div>
      <p class="dhr-question" style="font-size:20px;">Tell us a little about you</p>
      <div class="dhr-field" id="fName">

        <div class="dhr-field-error">Please enter your name.</div>
      </div>
      <div class="dhr-field" id="fDob">

        <label style="display:flex; align-items:flex-start; gap:10px; cursor:pointer; text-transform:none; font-weight:400; letter-spacing:normal; font-size:13.5px; color:var(--ink); margin-bottom:0;">

        <div class="dhr-field-error">Please agree to the research consent to continue.</div>

      <button class="dhr-start-btn" id="startBtn">Begin the quiz</button>
      <p class="dhr-privacy-note">Your details help us stay in touch and send your surprise gift. We won't share them with anyone else.</p>
    `;

    document.getElementById('startBtn').addEventListener('click', () => {
      const nameVal = document.getElementById('iName').value.trim();
      const dobVal = document.getElementById('iDob').value.trim();
      const emailVal = document.getElementById('iEmail').value.trim();
      const consentVal = document.getElementById('iConsent').checked;
      document.getElementById('fName').classList.toggle('err', !nameVal);
      document.getElementById('fDob').classList.toggle('err', !dobVal);
      document.getElementById('fEmail').classList.toggle('err', !isValidEmail(emailVal));

      dhrAnswers = [];
      stage = 'quiz'; current = 0; totalScore = 0;
      renderQuestion();
    });
  }

  // ---------- QUIZ ----------
  function renderQuestion() {
    progressWrap.style.display = 'block';
    titleEl.textContent = "DHR";
    titleSubEl.textContent = "A Mental Wellbeing Quiz for Men";

    const item = questions[current];
    glow.style.background = 'radial-gradient(circle, rgba(167,139,196,0.26), transparent 70%)';

    let bodyHtml = `<div class="dhr-qnum">${item.section}</div><p class="dhr-question">${item.q}</p>`;

    if (item.type === 'image') {
      bodyHtml += `<div class="dhr-image-grid" id="optWrap"></div><div class="dhr-footer-row"></div>`;
      card.innerHTML = bodyHtml;
      const wrap = document.getElementById('optWrap');
      item.options.forEach(opt => {
        const tile = document.createElement('div');
        tile.className = 'dhr-image-tile';
        tile.innerHTML = `<span class="em">${opt.emoji}</span><span class="lb">${opt.label}</span>`;
        tile.addEventListener('click', () => { dhrAnswers[current] = opt.label; current++; goNextOrGate(); });
        wrap.appendChild(tile);
      });
    } else if (item.type === 'likert') {
      bodyHtml += `<div class="dhr-likert" id="optWrap"></div><div class="dhr-footer-row"><button class="dhr-next" id="nextBtn">Next</button></div>`;
      card.innerHTML = bodyHtml;
      const wrap = document.getElementById('optWrap');
      let selectedIdx = null;
      LIKERT_LABELS.forEach((label, i) => {
        const btn = document.createElement('button');
        btn.className = 'dhr-likert-btn';
        btn.innerHTML = `<span class="dhr-likert-dot"></span><span>${label}</span>`;
        btn.addEventListener('click', () => {
          selectedIdx = i;
          wrap.querySelectorAll('.dhr-likert-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          const pts = item.likertKey === 'A' ? LIKERT_A[i] : LIKERT_B[i];
          document.getElementById('nextBtn').dataset.pts = pts;
          document.getElementById('nextBtn').dataset.label = label;
          document.getElementById('nextBtn').classList.add('show');
        });
        wrap.appendChild(btn);
      });
      document.getElementById('nextBtn').addEventListener('click', (e) => {
        const pts = parseInt(e.target.dataset.pts || "0", 10);
        totalScore += pts;
        dhrAnswers[current] = e.target.dataset.label || '';
        current++;
        goNextOrGate();
      });

      bodyHtml += `<div class="dhr-options" id="optWrap"></div><div class="dhr-footer-row"><button class="dhr-next" id="nextBtn">Next</button></div>`;

        btn.className = 'dhr-opt';
        btn.innerHTML = `<span class="dhr-opt-emoji">${opt.emoji}</span><span>${opt.label}</span>`;
        btn.addEventListener('click', () => {
          wrap.querySelectorAll('.dhr-opt').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          document.getElementById('nextBtn').dataset.pts = opt.pts;
          document.getElementById('nextBtn').dataset.label = opt.label;
          document.getElementById('nextBtn').classList.add('show');
        });
        wrap.appendChild(btn);
      });
      document.getElementById('nextBtn').addEventListener('click', (e) => {
        const pts = parseInt(e.target.dataset.pts || "0", 10);
        totalScore += pts;
        dhrAnswers[current] = e.target.dataset.label || '';
        current++;
        goNextOrGate();
      });
    } else if (item.type === 'final') {
      bodyHtml += `<div class="dhr-options" id="optWrap"></div><div class="dhr-footer-row"><button class="dhr-next" id="nextBtn">See your reflection</button></div>`;
      card.innerHTML = bodyHtml;
      const wrap = document.getElementById('optWrap');
      item.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'dhr-opt';
        btn.innerHTML = `<span>${opt.label}</span>`;
        btn.addEventListener('click', () => {
          wrap.querySelectorAll('.dhr-opt').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          document.getElementById('nextBtn').dataset.choice = opt.label;
          document.getElementById('nextBtn').classList.add('show');
        });
        wrap.appendChild(btn);
      });
      document.getElementById('nextBtn').addEventListener('click', (e) => {
        q21Choice = e.target.dataset.choice || "";
        dhrAnswers[current] = q21Choice;
        submitFullQuiz();
        stage = 'gate';
        renderGate();
      });
    }
  }

  function goNextOrGate() {
    if (current >= questions.length) {
      stage = 'gate';
      renderGate();
    } else {
      renderQuestion();
    }
  }

  // ---------- INSTAGRAM GATE ----------
  function renderGate() {
    progressWrap.style.display = 'none';
    titleEl.textContent = "Almost there";
    titleSubEl.textContent = "";
    subEl.textContent = "One small step before your reflection is ready.";
    glow.style.background = 'radial-gradient(circle, rgba(219,58,113,0.2), transparent 70%)';

    card.innerHTML = `
      <div class="dhr-gate">
        <div class="dhr-gate-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="20" height="20" rx="6" stroke="#fff" stroke-width="1.8"/>
            <circle cx="12" cy="12" r="5" stroke="#fff" stroke-width="1.8"/>
            <circle cx="17.5" cy="6.5" r="1.2" fill="#fff"/>
          </svg>
        </div>
        <div class="dhr-gate-title">You've finished the quiz</div>
        <p class="dhr-gate-sub">Follow us on Instagram <b>@${IG_HANDLE}</b> to stay connected, then come back here to see your reflection and claim your surprise gift.</p>
        <a class="dhr-gate-follow" href="${IG_URL}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="#fff"><path d="M12 2.2c3.2 0 3.6 0 4.85.07 3.25.15 4.77 1.7 4.92 4.92.06 1.25.07 1.63.07 4.81s-.01 3.56-.07 4.81c-.15 3.21-1.66 4.77-4.92 4.92-1.25.06-1.62.07-4.85.07-3.2 0-3.6 0-4.85-.07-3.26-.15-4.77-1.71-4.92-4.92-.06-1.25-.07-1.62-.07-4.81s.01-3.56.07-4.81c.15-3.22 1.66-4.77 4.92-4.92C8.4 2.2 8.8 2.2 12 2.2zm0 1.8c-3.14 0-3.5.01-4.73.07-2.27.1-3.4 1.24-3.5 3.5-.06 1.22-.07 1.58-.07 4.71s.01 3.5.07 4.72c.1 2.26 1.23 3.4 3.5 3.5 1.22.06 1.58.07 4.73.07 3.14 0 3.5-.01 4.72-.07 2.26-.1 3.4-1.23 3.5-3.5.06-1.22.07-1.58.07-4.72s-.01-3.5-.07-4.72c-.1-2.26-1.24-3.4-3.5-3.5C15.5 4.01 15.14 4 12 4zm0 3.4a4.6 4.6 0 110 9.2 4.6 4.6 0 010-9.2zm0 1.8a2.8 2.8 0 100 5.6 2.8 2.8 0 000-5.6zm4.8-2a1.08 1.08 0 110 2.16 1.08 1.08 0 010-2.16z"/></svg>
          Follow @${IG_HANDLE}
        </a>
        <button class="dhr-gate-unlock" id="unlockBtn">I've followed. Show my results</button>
        <p class="dhr-gate-hint">Opens Instagram in a new tab.</p>
      </div>
    `;
    document.getElementById('unlockBtn').addEventListener('click', () => {
      stage = 'result';
      renderResult();
    });
  }

  // ---------- RESULT ENGINE ----------
  function getCategory(score) {
    if (score >= 82) return {
      name: "🌿 Keeping the Balance",
      desc: "You seem to have developed a way of meeting the demands of daily life without losing touch with yourself. You're able to step into the roles that require strength and responsibility, while also allowing yourself to step out of them when you're with the people who matter most. That ability to shift between these parts of yourself reflects a secure inner balance rather than staying locked in one way of being.<br><br>Your relationships also appear to leave room for mutual care. Instead of feeling you always have to carry others, you're able to receive support and lean on people when you need to. Holding onto these patterns matters. Even those who are resilient need relationships that offer a sense of safety, where they can put down their defenses and simply be themselves.",
      archetype: null,
      challenge: "Lean into your relationships. Reach out to a trusted friend or partner for a conversation where you do not have to be the one who holds everything together. Practice allowing yourself to be known rather than staying in the role of the caregiver."
    };
    if (score >= 68) return {
      name: "⚖️ Managing, But Carrying it Alone",
      desc: "From the outside, you appear steady, dependable, and capable of carrying what others need from you. You often take up the role of the one who protects, organizes, and keeps things from falling apart. Yet there may be a quieter experience underneath that competence, a tendency to rely heavily on self sufficiency and to keep your own strain out of view.<br><br>This can look like identifying strongly with the caretaker self, while the more vulnerable parts of you remain guarded. Relationships may begin to feel uneven. You are available for others, but it is harder to allow others to witness your uncertainty, fatigue, or need for support. Over time, carrying distress in private can create a sense of emotional isolation, even in close connections.<br><br>Letting trusted people see when you are tired is not a failure of strength. It is a movement toward greater reciprocity and emotional intimacy, the recognition that being held by others is as important as being the one who holds.",
      archetype: {
        name: "The Bhishma Archetype",
        desc: "Like Bhishma in the Mahabharata, this pattern reflects the figure who remains steadfast, dutiful, and protective, often at the cost of his own inner life. The growth of this archetype lies not in becoming less responsible, but in learning that wisdom also includes surrender, interdependence, and allowing oneself to receive care rather than standing guard alone."
      },
      challenge: "The next time someone you trust asks how you are doing, resist the urge to give the automatic answer. Share one honest sentence about what you have been carrying internally, even if it feels unfamiliar to let someone see that part of you."
    };
    if (score >= 54) return {
      name: "🌱 Carrying a Heavy Load",
      desc: "You are carrying a great deal right now. On the surface, you may appear composed and capable, but much of the pressure is being held privately. There may be an old belief that your value comes from what you can manage, repair, or endure, making it difficult to acknowledge your own limits or needs.<br><br>This can reflect an overidentification with the competent self, while more vulnerable parts remain hidden from others. In relationships, you may be more comfortable offering support than receiving it, leaving you to carry emotional burdens largely on your own. Over time, this kind of emotional containment can show up as exhaustion, tension, or a growing sense of disconnection from yourself.<br><br>The way you are coping has likely helped you through difficult periods, but it asks too much of you to be sustained indefinitely. Healing begins when you no longer feel that you have to carry everything alone.",
      archetype: {
        name: "The Hanuman Archetype",
        desc: "Like Hanuman, this archetype embodies extraordinary strength, devotion, and the willingness to shoulder immense responsibility in service of others. Its shadow emerges when strength becomes the only acceptable way of being. Growth comes through recognizing that true resilience includes humility, self compassion, and trusting that others can help carry the weight alongside you."
      },
      challenge: "Choose one responsibility or expectation that feels urgent but can realistically wait. Set it aside for the next 48 hours and pay attention to what comes up inside. Notice whether guilt, anxiety, or the pressure to keep proving yourself begins to surface."
    };
    if (score >= 40) return {
      name: "🔋 Running on Reserve",
      desc: "Your battery is running on empty. Somewhere along the way, you may have come to believe that rest, joy, and emotional connection have to be earned through constant effort rather than recognized as essential parts of being human. As a result, work, family, and responsibility take priority, while your own emotional needs are repeatedly pushed aside.<br><br>This can reflect a strong identification with the responsible self, where personal needs are experienced as something to postpone or minimize. In relationships, you may find yourself consistently responding to the needs of others while leaving little space for your own. Over time, this imbalance can give rise to quiet resentment, emotional depletion, or a growing wish to withdraw from everything simply to recover.<br><br>Rest is not something that has to be deserved. It is part of what allows you to remain emotionally available, psychologically grounded, and connected to yourself and the people around you.",
      archetype: {
        name: "The Arjuna Archetype",
        desc: "Like Arjuna before the battle of Kurukshetra, this archetype carries a deep sense of duty and responsibility. Its shadow appears when obligation becomes so consuming that it eclipses one's own emotional life. The task is not to abandon responsibility, but to reconnect with the inner self that can act with clarity, balance, and compassion rather than from relentless obligation."
      },
      challenge: "Set aside one uninterrupted hour this week that belongs entirely to you. Protect it as you would any important commitment. Let it be a space where you are not producing, caring for others, or distracting yourself, but simply reconnecting with what helps you feel emotionally restored."
    };
    return {
      name: "🌧️ Severe Overload",
      desc: "You have been carrying an immense amount of pressure for a long time, and it may be stretching your emotional resources beyond what they can comfortably hold. When stress reaches this level, it is common to turn inward, withdraw from others, and rely on silent endurance as a way of coping. You may find yourself believing that sharing your pain would burden the people you care about or make you appear less capable.<br><br>From a psychodynamic perspective, this can reflect a protective pattern in which vulnerability is kept out of relationships, even when connection is most needed. The more distress is held privately, the greater the risk of feeling emotionally isolated, detached, or disconnected from yourself and others. What once served as a way of staying strong can gradually become a source of loneliness.<br><br>You do not have to carry this alone. Allowing someone you trust to witness your experience is not a sign of weakness. It is an act of courage that opens the possibility of support, emotional regulation, and genuine connection.",
      archetype: {
        name: "The Karna Archetype",
        desc: "Like Karna in the Mahabharata, this archetype carries extraordinary resilience, loyalty, and the capacity to endure hardship without complaint. Its shadow lies in believing that suffering must be borne alone. Growth begins with recognizing that true strength is found not only in endurance, but also in allowing oneself to be seen, supported, and held in relationship."
      },
      challenge: "Break the pattern of carrying everything on your own. Reach out to one trusted person, whether a close friend, family member, or therapist. Say the part you usually keep to yourself: \u201CI have been carrying more than I can hold right now, and I need someone to be with me in it.\u201D"
    };
  }

  function getLonging(choice) {
    if (choice === "More peace" || choice === "Less pressure") {
      return "Your deep pull toward peace and less pressure means your system has been stuck on high alert for too long. This isn't just about needing a weekend off; it's a loud cry from your mind to stop being the ultimate fixer of your world. It usually means you've tied your sense of safety to having total control over everything. Real peace won't come from finally finishing your to-do list; it will come from trusting that the world won't fall apart if you take your hands off the wheel and rest.";
    }
    if (choice === "Someone to talk to" || choice === "More meaningful friendships") {
      return "Longing for real connection highlights how lonely it feels to keep your emotions locked away. You can be surrounded by people every day at work or home, yet still feel completely isolated in your own head. Reaching out to build a real friendship or talk to someone isn't a sign of weakness or a failure to be a man. We aren't built to survive in solitary confinement, we are wired to face life in tribes and tight relationships.";
    }
    if (choice === "Better work-life balance" || choice === "More time") {
      return "Constantly wishing for more time can sometimes be a subconscious way to avoid sitting with our own inner lives. When we keep ourselves completely consumed by work and tasks, we don't have to look at the heavier, more complicated feelings waiting for us underneath. Ask yourself an honest question: if you suddenly got the free time you are asking for, what are the quiet thoughts or buried stresses that would finally catch up to you? Balance isn't a scheduling problem; it's about learning to say \u201Cno\u201D to the world so you can say \u201Cyes\u201D to yourself.";
    }
    return "Noticing and naming this specific missing piece is a huge step in figuring out what you need. It highlights exactly where your life feels thin and unprotected right now. Don't look at this as another goal you need to achieve or fix. Use it as a compass telling you exactly where your life is asking you to slow down, set a firmer boundary, or have an honest conversation with yourself.";
  }

  function renderResult() {
    progressWrap.style.display = 'none';
    titleEl.textContent = "DHR";
    titleSubEl.textContent = "Your Reflection";
    subEl.textContent = "";
    glow.style.background = 'radial-gradient(circle, rgba(217,164,65,0.28), transparent 70%)';

    const maxScore = 95;
    const pct = Math.round((totalScore / maxScore) * 100);
    const cat = getCategory(totalScore);
    const longing = getLonging(q21Choice);
    const firstName = escapeHtml(userInfo.name.split(' ')[0] || 'friend');

    let archetypeHtml = '';
    if (cat.archetype) {
      archetypeHtml = `
        <div class="dhr-archetype">
          <div class="dhr-archetype-label">Jungian Archetype \u00B7 Indian Spiritual Frame</div>
          <div class="dhr-archetype-name">${cat.archetype.name}</div>
          <div class="dhr-archetype-desc">${cat.archetype.desc}</div>
        </div>`;
    }

    card.innerHTML = `
      <div class="dhr-result-score-row">
        <div class="dhr-result-score">${totalScore}<span>/${maxScore}</span></div>
        <div class="dhr-result-bar-wrap">
          <div class="dhr-result-bar-track"><div class="dhr-result-bar-fill" style="width:${pct}%;"></div></div>
          <div class="dhr-result-bar-pct">${pct}% \u00B7 ${firstName}'s check-in</div>
        </div>
      </div>

      <div class="dhr-category">
        <div class="dhr-category-name">${cat.name}</div>
        <div class="dhr-category-desc"><p>${cat.desc}</p></div>
      </div>

      ${archetypeHtml}

      <div class="dhr-challenge">
        <div class="dhr-challenge-label">Your challenge for this week</div>
        <div class="dhr-challenge-text">${cat.challenge}</div>
      </div>

      <div class="dhr-longing">
        <div class="dhr-longing-label">What you're longing for</div>
        <div class="dhr-longing-choice">"${escapeHtml(q21Choice)}"</div>
        <div class="dhr-longing-text">${longing}</div>
      </div>

      <div class="dhr-gift">
        <div class="dhr-gift-label">Last page</div>
        <div class="dhr-gift-title">Collect your surprise gift</div>
        <div class="dhr-gift-msg">Thank you, ${firstName}, for being honest with yourself today. Keep an eye on your inbox at ${escapeHtml(userInfo.email)} \u2014 your surprise gift is on its way to you.</div>
      </div>

      <div class="dhr-closing">A Note on this Space: This check-in is just a simple tool to help you look into your own world and relationships; it is not a medical diagnosis or a therapy replacement. If the weight you are holding is causing deep anxiety, making you feel hopeless, or making it hard to get through your daily life, please respect yourself enough to bring someone else into your corner. Talking to a professional therapist or counselor is a profound way to share the load and find a healthier way to move forward.</div>

      <button class="dhr-restart" id="restartBtn">Take it again</button>
    `;

    document.getElementById('restartBtn').addEventListener('click', () => {
      stage = 'intake'; current = 0; totalScore = 0; q21Choice = "";
      renderIntake();
    });
  }

  renderIntake();
})();
</script>
</body>
